[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "afterimage"
version = "0.1.0"
description = "Deterministic memory engram for small language models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Michael Harding"}]
keywords = ["memory", "llm", "agents", "retrieval", "deterministic"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/XxChonkExX/AfterImage-Engram"
Repository = "https://github.com/XxChonkExX/AfterImage-Engram"

[tool.setuptools.packages.find]
where = ["src"]
